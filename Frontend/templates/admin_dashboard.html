<!DOCTYPE html>
<html>
<head>

<title>Admin Dashboard</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

.dashboard-boxes{
    display:flex;
    gap:20px;
    margin-top:30px;
    flex-wrap:wrap;
}

.box{
    flex:1;
    min-width:250px;
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    color:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.box h2{
    font-size:40px;
}

.actions{
    margin-top:40px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.actions a{
    text-decoration:none;
}

.actions button{
    padding:15px 25px;
    font-size:16px;
}

</style>

</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
</header>

{% include 'navbar.html' %}

<div class="container">

<h2>Welcome, {{ admin_name }}</h2>

<div class="dashboard-boxes">

<div class="box">
    <h2>{{ total_students }}</h2>
    <p>Total Students</p>
</div>

<div class="box">
    <h2>{{ total_events }}</h2>
    <p>Total Events</p>
</div>

<div class="box">
    <h2>{{ total_departments }}</h2>
    <p>Departments</p>
</div>

</div>

<div class="actions">

<a href="/add-event">
    <button>Add Event</button>
</a>

<a href="/add-notice">
    <button>Add Notice</button>
</a>

<a href="/manage-attendance">
    <button>Manage Attendance</button>
</a>

<a href="/reports">
    <button>View Reports</button>
</a>

<a href="/view-feedbacks">
    <button>View Feedbacks</button>
</a>

</div>

</div>

</body>
</html>
