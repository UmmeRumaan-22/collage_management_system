<!DOCTYPE html>
<html>
<head>

<title>Reports</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

.report-box{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.report-box h2{
    color:#4e54c8;
}

.report-item{
    padding:15px;
    margin-top:15px;
    background:#f5f5f5;
    border-radius:8px;
    font-size:18px;
}

</style>

</head>

<body>

<header>
    <h1>Reports Dashboard</h1>
</header>

{% include 'navbar.html' %}

<div class="container">

<div class="report-box">

<h2>System Reports</h2>

<div class="report-item">
    Total Students:
    <strong>{{ students.total_students }}</strong>
</div>

<div class="report-item">
    Total Events:
    <strong>{{ events.total_events }}</strong>
</div>

<div class="report-item">
    Attendance:
    <strong>95%</strong>
</div>

</div>

</div>

</body>
</html>
