<!DOCTYPE html>
<html>
<head>

<title>Attendance</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

{% include 'navbar.html' %}

<div class="container">

<div class="card">

<h2>Mark Attendance</h2>

<form method="POST">

<select name="status" required>

<option value="">
Select Attendance
</option>

<option value="Present">
Present
</option>

<option value="Absent">
Absent
</option>

</select>

<button type="submit">
Submit Attendance
</button>

</form>

</div>

<h2>Your Attendance Records</h2>

{% for row in attendance_records %}

<div class="card">

<p>
<strong>Status:</strong>
{{ row.status }}
</p>

<p>
<strong>Date:</strong>
{{ row.attendance_date }}
</p>

</div>

{% endfor %}

</div>

</body>
</html>
